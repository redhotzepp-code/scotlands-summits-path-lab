name: Build River Tilt path data and publish Path Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: river-tilt-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python -m pip install --disable-pip-version-check 'osmium>=4,<5' 'shapely>=2,<3'
      - name: Validate conversion code with isolated test fixture
        run: |
          python scripts/build_paths.py --input tests/sample.osm --output-dir /tmp/fixture-test --min-paths 4
          python scripts/verify_paths.py /tmp/fixture-test/paths.geojson /tmp/fixture-test/manifest.json
      - name: Download bounded River Tilt OpenStreetMap sections
        run: |
          python scripts/download_region.py --output /tmp/river-tilt.osm
          test "$(stat -c%s /tmp/river-tilt.osm)" -gt 100000
      - name: Build verified static paths (fail closed if empty)
        run: |
          python scripts/build_paths.py --input /tmp/river-tilt.osm --output-dir site/data --min-paths 10
          python scripts/verify_paths.py site/data/paths.geojson site/data/manifest.json
      - name: Validate measured hill labels (no fabricated heights)
        run: |
          python scripts/build_hills.py --input tests/sample_hills.osm --output /tmp/hills-fixture.geojson
          python -c 'import json; a=json.load(open("/tmp/hills-fixture.geojson"))["features"]; assert len(a)==3; assert a[0]["properties"]["ele"]==692; assert "ele" not in a[1]["properties"]; assert "ele" not in a[2]["properties"]'
          python scripts/build_hills.py --input /tmp/river-tilt.osm --output site/data/hills.geojson
          python -c 'import json; a=json.load(open("site/data/hills.geojson")); assert a["type"]=="FeatureCollection"; assert len(a["features"])>0; assert all(f["geometry"]["type"]=="Point" for f in a["features"])'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4